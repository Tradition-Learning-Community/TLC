name: Temporary media dependency lock
on:
  push:
    branches: [fix/tlc-website-editorial-mobile-and-media-ux]
    paths: [.github/workflows/temporary-media-deps.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install -g pnpm@10.33.2
      - run: pnpm add @aws-sdk/client-s3@^3.900.0
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m "Lock standard S3-compatible media storage SDK" || exit 0
          git push origin HEAD:fix/tlc-website-editorial-mobile-and-media-ux
