name: Stage 4 auth dependency sync
on:
  push:
    branches: [ feature/stage4-accounts-notifications-tests ]
    paths: [ .github/workflows/stage4-auth-sync.yml ]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@10.33.2
      - run: pnpm add @neon/auth
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m "Lock Neon Auth SDK for individual staff accounts" || exit 0
          git push origin HEAD:feature/stage4-accounts-notifications-tests
